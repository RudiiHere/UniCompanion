name: my_university_companion
description: "AI based Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter



  # Supabase
  supabase_flutter: ^2.3.0

  # State management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^16.0.0

  # Offline cache
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # UI
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0

  # HTTP (for Gemini AI)
  http: ^1.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Local notifications (task deadline reminders)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
